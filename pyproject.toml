[project]
name = "interesting"
version = "0.1.0"
description = "MCP server for deterministically tracking news stories of interest"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4",
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "mypy>=1.14",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "ruff>=0.15.12",
    "types-colorama>=0.4",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
